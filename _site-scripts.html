<!-- Site-wide interactivity (included on every page via _quarto.yml) -->
<div class="read-progress" aria-hidden="true"></div>
<a class="back-to-top" href="#" aria-label="Back to top"><i class="bi bi-arrow-up"></i></a>
<script>
(function () {
  document.documentElement.classList.add("js");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var header = document.getElementById("quarto-header");
  var bar = document.querySelector(".read-progress");
  var topBtn = document.querySelector(".back-to-top");

  /* 1. Navbar shrink + reading progress + back-to-top */
  function onScroll() {
    var y = window.scrollY;
    if (header) header.classList.toggle("is-scrolled", y > 20);
    var max = document.documentElement.scrollHeight - window.innerHeight;
    if (bar) bar.style.transform = "scaleX(" + (max > 0 ? Math.min(y / max, 1) : 0) + ")";
    if (topBtn) topBtn.classList.toggle("show", y > 600);
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();
  if (topBtn) topBtn.addEventListener("click", function (e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
  });

  /* 1b. Little skateboarding stick figure next to the name in the navbar */
  var logo = document.querySelector(".navbar-logo");
  var brandLink = document.querySelector(".navbar-brand:not(.navbar-brand-logo)");
  if (logo && brandLink) {
    var sk = document.createElement("img");
    sk.className = "nav-skater";
    sk.alt = "";
    sk.setAttribute("aria-hidden", "true");
    sk.src = logo.getAttribute("src").replace("logo.svg", "skater-mini.svg");
    brandLink.appendChild(sk);
  }

  /* 2. Sliding hover pill in the navbar (desktop only) */
  var navList = document.querySelector("#navbarCollapse .navbar-nav.me-auto");
  if (navList && window.matchMedia("(hover: hover)").matches) {
    var pill = document.createElement("span");
    pill.className = "nav-indicator";
    navList.appendChild(pill);
    navList.classList.add("has-indicator");
    navList.querySelectorAll(".nav-link").forEach(function (link) {
      link.addEventListener("mouseenter", function () {
        if (window.innerWidth < 1200) return;
        pill.style.width = link.offsetWidth + "px";
        pill.style.height = link.offsetHeight + "px";
        pill.style.transform = "translate(" + link.offsetLeft + "px," + link.offsetTop + "px)";
        pill.style.opacity = "1";
      });
    });
    navList.addEventListener("mouseleave", function () { pill.style.opacity = "0"; });
  }

  /* 3. Scroll-reveal for cards, figures and sections */
  var targets = document.querySelectorAll(
    ".reveal, .feature-card, .tile, .story, .doc-viewer, .lead-card, .quarto-post, .lab-nav, .cs-card, .glance, .decision, .video-frame, .improve, main.content > section > .quarto-figure"
  );
  if ("IntersectionObserver" in window && !reduce) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        entry.target.classList.add("is-visible");
        io.unobserve(entry.target);
      });
    }, { threshold: 0.08, rootMargin: "0px 0px -40px 0px" });
    targets.forEach(function (el) { el.classList.add("reveal"); io.observe(el); });
  } else {
    targets.forEach(function (el) { el.classList.add("is-visible"); });
  }
})();
</script>

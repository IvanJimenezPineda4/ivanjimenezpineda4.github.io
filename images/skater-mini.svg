<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="-60 52 120 120">
  <style>
    .ink { fill: none; stroke: #16181d; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .roll { animation: roll 2.4s ease-in-out infinite alternate; }
    .ollie { transform-box: fill-box; transform-origin: 50% 100%; animation: ollie 3.2s ease-in-out infinite; }
    .bob { animation: bob .45s ease-in-out infinite alternate; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin .4s linear infinite; }
    @keyframes roll { from { transform: translateX(-12px); } to { transform: translateX(12px); } }
    @keyframes ollie {
      0%, 62%, 100% { transform: none; }
      72% { transform: translateY(-22px) rotate(-10deg); }
      82% { transform: translateY(-24px) rotate(6deg); }
      92% { transform: none; }
    }
    @keyframes bob { to { transform: translateY(-3px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g class="roll">
    <g class="ollie">
      <g class="bob">
        <circle class="ink" cx="7" cy="67" r="11"/>
        <path class="ink" d="M0 112 L4 80"/>
        <path class="ink" d="M4 86 L-12 96 L-26 92"/>
        <path class="ink" d="M4 86 L20 94 L34 90"/>
        <path class="ink" d="M0 112 L-14 130 L-20 147"/>
        <path class="ink" d="M0 112 L12 128 L17 147"/>
      </g>
      <path class="ink" d="M-40 144 Q-36 151 -28 151 L28 151 Q36 151 40 144"/>
      <g class="wheel"><circle cx="-20" cy="159" r="7" fill="#16181d"/><path d="M-20 154 L-20 164" stroke="#E5A823" stroke-width="2.5"/></g>
      <g class="wheel"><circle cx="20" cy="159" r="7" fill="#16181d"/><path d="M20 154 L20 164" stroke="#E5A823" stroke-width="2.5"/></g>
    </g>
  </g>
</svg>
